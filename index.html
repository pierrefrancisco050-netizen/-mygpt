<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyGPT</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    background:#fff;
    color:#222;
}

.sidebar{
    width:230px;
    background:#f7f7f8;
    border-right:1px solid #ddd;
    padding:14px;
    display:flex;
    flex-direction:column;
}

.logo{ font-size:19px; font-weight:bold; margin-bottom:14px; }

.new-chat{
    border:0; padding:10px; border-radius:10px;
    background:#222; color:white; cursor:pointer; font-size:13.5px;
}
.new-chat:hover{ background:#000; }

.history{ margin-top:16px; overflow:auto; flex:1; }
.history-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 10px; border-radius:8px; cursor:pointer; margin-bottom:3px; font-size:12.5px; color:#444;
}
.history-item:hover, .history-item.active{ background:#e5e5e5; }
.history-item .title{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
.history-item .del{ opacity:0; color:#999; font-size:14px; padding:0 4px; }
.history-item:hover .del{ opacity:1; }
.history-item .del:hover{ color:#c00; }
.empty-history{ font-size:11.5px; color:#aaa; padding:8px 10px; }

.main{ flex:1; display:flex; flex-direction:column; }

.header{
    height:56px; border-bottom:1px solid #ddd;
    display:flex; align-items:center; padding:0 20px; font-weight:600;
}

.messages{ flex:1; overflow-y:auto; padding:30px; }

.message{ max-width:800px; margin:0 auto 26px; display:flex; gap:14px; }

.avatar{
    min-width:32px; height:32px; border-radius:50%;
    display:flex; justify-content:center; align-items:center;
    color:white; font-size:11px; font-weight:600;
}
.avatar.user{ background:#5b8cff; }
.avatar.ai{ background:#222; }

.content{ line-height:1.6; width:100%; padding-top:5px; font-size:14.5px; }
.content p{ margin-bottom:10px; white-space:pre-wrap; }
.content p:last-child{ margin-bottom:0; }
.content ul{ margin:8px 0 8px 20px; }
.content li{ margin-bottom:4px; }
.content strong{ font-weight:700; }
.content code{ background:#f0f0f0; padding:1px 5px; border-radius:4px; font-family:monospace; font-size:0.92em; }
.content img.attached{ max-width:220px; border-radius:10px; margin-top:6px; display:block; }

.bottom{ padding:12px 25px 20px; }

.attach-preview{
    max-width:800px; margin:0 auto 8px; display:none;
    align-items:center; gap:8px; font-size:12.5px; color:#555;
}
.attach-preview.show{ display:flex; }
.attach-preview img{ width:40px; height:40px; object-fit:cover; border-radius:6px; }
.attach-preview .remove{ cursor:pointer; color:#c00; font-size:13px; }

.input{
    max-width:800px; margin:auto; border:1px solid #ccc; border-radius:15px;
    padding:8px; display:flex; align-items:flex-end; gap:4px; box-shadow:0 2px 10px #eee;
}

.icon-btn{
    width:36px; height:36px; border:0; background:transparent;
    border-radius:10px; cursor:pointer; font-size:17px; color:#555; flex-shrink:0;
}
.icon-btn:hover{ background:#f0f0f0; }
.icon-btn.active{ color:#e33; }

textarea{
    flex:1; border:0; outline:0; resize:none; font-size:15px; padding:9px;
    min-height:42px; max-height:150px; font-family:Arial,sans-serif;
}

button.send{
    width:40px; height:40px; border:0; border-radius:10px;
    background:#222; color:white; cursor:pointer; font-size:17px; flex-shrink:0;
}
button.send:hover:not(:disabled){ opacity:.8; }
button.send:disabled{ opacity:.35; cursor:not-allowed; }

.hint{ text-align:center; font-size:11px; color:#aaa; margin-top:8px; }

.welcome{ text-align:center; margin-top:130px; }
.welcome h1{ font-size:32px; margin-bottom:8px; }
.welcome p{ color:#777; }

.dots{ display:flex; gap:4px; padding-top:8px; }
.dots span{ width:6px; height:6px; border-radius:50%; background:#999; animation:b 1.2s infinite ease-in-out; }
.dots span:nth-child(2){ animation-delay:.15s; }
.dots span:nth-child(3){ animation-delay:.3s; }
@keyframes b{ 0%,60%,100%{transform:translateY(0);opacity:.4;} 30%{transform:translateY(-4px);opacity:1;} }

@media(max-width:700px){
    .sidebar{ display:none; }
    .messages{ padding:15px; }
    .bottom{ padding:10px; }
}
</style>
</head>

<body>

<div class="sidebar">
    <div class="logo">🤖 MyGPT</div>
    <button class="new-chat" id="new-chat-btn">＋ Nouveau chat</button>
    <div class="history" id="history">
        <div class="empty-history">Tes conversations apparaîtront ici</div>
    </div>
</div>

<div class="main">
    <div class="header">MyGPT</div>

    <div class="messages" id="messages">
        <div class="welcome" id="welcome">
            <h1>Bonjour 👋</h1>
            <p>Comment puis-je t'aider ?</p>
        </div>
    </div>

    <div class="bottom">
        <div class="attach-preview" id="attach-preview">
            <img id="attach-thumb" src="" alt="">
            <span>Image jointe</span>
            <span class="remove" id="remove-attach">✕ retirer</span>
        </div>

        <div class="input">
            <button class="icon-btn" id="attach-btn" title="Joindre une image">📎</button>
            <input type="file" id="file-input" accept="image/*" style="display:none;">
            <textarea id="input" placeholder="Message MyGPT..." rows="1"></textarea>
            <button class="icon-btn" id="mic-btn" title="Parler">🎤</button>
            <button class="icon-btn" id="image-mode-btn" title="Générer une image">🎨</button>
            <button class="send" id="send-btn">↑</button>
        </div>
        <div class="hint">MyGPT peut faire des erreurs. Vérifie les infos importantes.</div>
    </div>
</div>

<script>

/* =========================
   CONFIGURATION
   Ces adresses pointent vers TON serveur (pas directement vers Google).
   La clé API est cachée côté serveur, jamais ici.
========================= */

const API_URL = "/api/chat";
const IMAGE_API_URL = "/api/image";


/* =========================
   ÉTAT
========================= */

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const historyEl = document.getElementById('history');
const newChatBtn = document.getElementById('new-chat-btn');
const attachBtn = document.getElementById('attach-btn');
const fileInput = document.getElementById('file-input');
const attachPreview = document.getElementById('attach-preview');
const attachThumb = document.getElementById('attach-thumb');
const removeAttach = document.getElementById('remove-attach');
const micBtn = document.getElementById('mic-btn');
const imageModeBtn = document.getElementById('image-mode-btn');

let chats = [];
let currentChat = [];
let activeChatIndex = null;
let isLoading = false;
let pendingImage = null; // { base64, mimeType }
let imageMode = false;

imageModeBtn.addEventListener('click', () => {
    imageMode = !imageMode;
    imageModeBtn.classList.toggle('active', imageMode);
    inputEl.placeholder = imageMode ? "Décris l'image à générer..." : "Message MyGPT...";
});


/* =========================
   AFFICHAGE / MARKDOWN SIMPLE
========================= */

function showWelcome(show){
    let w = document.getElementById('welcome');
    if(show && !w){
        messagesEl.innerHTML = '<div class="welcome" id="welcome"><h1>Bonjour 👋</h1><p>Comment puis-je t\'aider ?</p></div>';
    } else if(!show && w){
        w.remove();
    }
}

function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// Convertit un minimum de Markdown (gras, listes, code) en HTML propre
function renderContent(text){
    let safe = escapeHtml(text);

    // gras **texte**
    safe = safe.replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>');

    // code `texte`
    safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');

    // listes à puces (lignes commençant par * ou -)
    const lines = safe.split('\n');
    let html = '';
    let inList = false;

    lines.forEach(line => {
        const trimmed = line.trim();
        if(/^[\*\-]\s+/.test(trimmed)){
            if(!inList){ html += '<ul>'; inList = true; }
            html += '<li>' + trimmed.replace(/^[\*\-]\s+/, '') + '</li>';
        } else {
            if(inList){ html += '</ul>'; inList = false; }
            if(trimmed.length){
                html += '<p>' + line + '</p>';
            }
        }
    });
    if(inList) html += '</ul>';

    return html || '<p></p>';
}

function addMessage(role, text, imageDataUrl){
    showWelcome(false);
    const row = document.createElement('div');
    row.className = 'message';
    const avatar = document.createElement('div');
    avatar.className = 'avatar ' + (role === 'user' ? 'user' : 'ai');
    avatar.textContent = role === 'user' ? 'TOI' : 'IA';
    const content = document.createElement('div');
    content.className = 'content';
    content.innerHTML = renderContent(text);

    if(imageDataUrl){
        const img = document.createElement('img');
        img.src = imageDataUrl;
        img.className = 'attached';
        content.appendChild(img);
    }

    row.appendChild(avatar);
    row.appendChild(content);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return content;
}

function addTyping(){
    const row = document.createElement('div');
    row.className = 'message';
    row.id = 'typing-row';
    const avatar = document.createElement('div');
    avatar.className = 'avatar ai';
    avatar.textContent = 'IA';
    const content = document.createElement('div');
    content.className = 'content';
    content.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
    row.appendChild(avatar);
    row.appendChild(content);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping(){
    const t = document.getElementById('typing-row');
    if(t) t.remove();
}


/* =========================
   PIÈCE JOINTE (IMAGE)
========================= */

attachBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = () => {
        const dataUrl = reader.result; // "data:image/png;base64,XXXX"
        const base64 = dataUrl.split(',')[1];
        pendingImage = { base64, mimeType: file.type, dataUrl };
        attachThumb.src = dataUrl;
        attachPreview.classList.add('show');
    };
    reader.readAsDataURL(file);
});

removeAttach.addEventListener('click', () => {
    pendingImage = null;
    fileInput.value = '';
    attachPreview.classList.remove('show');
});


/* =========================
   MICRO (RECONNAISSANCE VOCALE)
========================= */

let recognition = null;
let isListening = false;

const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

if(SpeechRecognitionAPI){
    recognition = new SpeechRecognitionAPI();
    recognition.lang = 'fr-FR';
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        inputEl.value = (inputEl.value ? inputEl.value + ' ' : '') + transcript;
    };

    recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('active');
    };

    micBtn.addEventListener('click', () => {
        if(isListening){
            recognition.stop();
        } else {
            recognition.start();
            isListening = true;
            micBtn.classList.add('active');
        }
    });
} else {
    micBtn.style.display = 'none'; // pas supporté par ce navigateur
}


/* =========================
   HISTORIQUE
========================= */

function renderHistory(){
    historyEl.innerHTML = '';
    if(chats.length === 0){
        historyEl.innerHTML = '<div class="empty-history">Tes conversations apparaîtront ici</div>';
        return;
    }
    chats.forEach((chat, i) => {
        const item = document.createElement('div');
        item.className = 'history-item' + (i === activeChatIndex ? ' active' : '');

        const title = document.createElement('div');
        title.className = 'title';
        const firstUserMsg = chat.find(m => m.role === 'user');
        title.textContent = firstUserMsg ? firstUserMsg.text.slice(0, 24) : 'Conversation';

        const del = document.createElement('div');
        del.className = 'del';
        del.textContent = '✕';
        del.addEventListener('click', (e) => {
            e.stopPropagation();
            deleteChat(i);
        });

        item.appendChild(title);
        item.appendChild(del);
        item.addEventListener('click', () => loadChat(i));
        historyEl.appendChild(item);
    });
}

function loadChat(i){
    saveCurrentIfNeeded();
    activeChatIndex = i;
    currentChat = [...chats[i]];
    messagesEl.innerHTML = '';
    showWelcome(false);
    currentChat.forEach(m => addMessage(m.role === 'user' ? 'user' : 'ai', m.text, m.imageDataUrl));
    renderHistory();
}

function deleteChat(i){
    chats.splice(i, 1);
    if(activeChatIndex === i){
        activeChatIndex = null;
        currentChat = [];
        messagesEl.innerHTML = '';
        showWelcome(true);
    } else if(activeChatIndex !== null && activeChatIndex > i){
        activeChatIndex--;
    }
    renderHistory();
}

function saveCurrentIfNeeded(){
    if(currentChat.length === 0) return;
    if(activeChatIndex === null){
        chats.push([...currentChat]);
        activeChatIndex = chats.length - 1;
    } else {
        chats[activeChatIndex] = [...currentChat];
    }
}

newChatBtn.addEventListener('click', () => {
    saveCurrentIfNeeded();
    currentChat = [];
    activeChatIndex = null;
    messagesEl.innerHTML = '';
    showWelcome(true);
    renderHistory();
});


/* =========================
   ENVOYER (API Gemini)
========================= */

async function send(){

    const text = inputEl.value.trim();
    if((!text && !pendingImage) || isLoading) return;

    isLoading = true;
    sendBtn.disabled = true;

    const imgToSend = pendingImage;
    inputEl.value = '';
    inputEl.style.height = 'auto';
    pendingImage = null;
    fileInput.value = '';
    attachPreview.classList.remove('show');

    addMessage('user', text, imgToSend ? imgToSend.dataUrl : null);
    currentChat.push({
        role: 'user',
        text: text,
        imageDataUrl: imgToSend ? imgToSend.dataUrl : null,
        imageBase64: imgToSend ? imgToSend.base64 : null,
        imageMime: imgToSend ? imgToSend.mimeType : null
    });
    addTyping();

    // ===== MODE GÉNÉRATION D'IMAGE =====
    if(imageMode && !imgToSend){
        try{
            const response = await fetch(IMAGE_API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ role: "user", parts: [{ text: text }] }]
                })
            });

            if(!response.ok){
                if(response.status === 429){
                    throw new Error("LIMITE_ATTEINTE");
                }
                throw new Error("Erreur API : " + response.status);
            }

            const data = await response.json();
            const parts = data?.candidates?.[0]?.content?.parts || [];
            const imgPart = parts.find(p => p.inline_data || p.inlineData);
            const textPart = parts.find(p => p.text);

            removeTyping();

            if(imgPart){
                const inline = imgPart.inline_data || imgPart.inlineData;
                const dataUrl = "data:" + inline.mime_type + ";base64," + inline.data;
                addMessage('ai', textPart ? textPart.text : 'Voici ton image :', dataUrl);
                currentChat.push({ role: 'assistant', text: textPart ? textPart.text : 'Voici ton image :', imageDataUrl: dataUrl });
            } else {
                addMessage('ai', "Je n'ai pas réussi à générer d'image, réessaie avec une autre description.");
            }

            saveCurrentIfNeeded();
            renderHistory();

        } catch(error){
            removeTyping();
            if(error.message === "LIMITE_ATTEINTE"){
                addMessage('ai', "⏳ La limite gratuite d'images est atteinte pour le moment. Réessaie dans quelques minutes.");
            } else {
                addMessage('ai', "❌ Erreur génération image : " + error.message);
            }
        } finally {
            isLoading = false;
            sendBtn.disabled = false;
        }
        return;
    }

    // ===== MODE TEXTE NORMAL (rapide) =====
    try{

        const geminiContents = currentChat.map(m => {
            const parts = [];
            if(m.text) parts.push({ text: m.text });
            if(m.imageBase64){
                parts.push({
                    inline_data: {
                        mime_type: m.imageMime,
                        data: m.imageBase64
                    }
                });
            }
            return {
                role: m.role === 'assistant' ? 'model' : 'user',
                parts: parts
            };
        });

        const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                contents: geminiContents,
                generationConfig: {
                    maxOutputTokens: 600,
                    thinkingConfig: { thinkingBudget: 0 }
                }
            })
        });

        if(!response.ok){
            if(response.status === 429){
                throw new Error("LIMITE_ATTEINTE");
            }
            throw new Error("Erreur API : " + response.status);
        }

        const data = await response.json();

        const answer =
            data?.candidates?.[0]?.content?.parts?.[0]?.text ||
            "Je n'ai pas reçu de réponse.";

        removeTyping();
        addMessage('ai', answer);
        currentChat.push({ role: 'assistant', text: answer });

        saveCurrentIfNeeded();
        renderHistory();

    } catch(error){
        removeTyping();
        if(error.message === "LIMITE_ATTEINTE"){
            addMessage('ai', "⏳ La limite gratuite est atteinte pour le moment. Réessaie dans quelques minutes.");
        } else {
            addMessage('ai', "❌ Erreur : " + error.message);
        }
    } finally {
        isLoading = false;
        sendBtn.disabled = false;
    }

}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        send();
    }
});
inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + 'px';
});

</script>

</body>
</html>
